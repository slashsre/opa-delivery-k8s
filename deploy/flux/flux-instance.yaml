# -------------------------------------------------------------------
# FluxInstance — instala Flux y sincroniza este repositorio (modo GitOps)
#
# Requiere Flux Operator:
#   helm upgrade --install flux-operator \
#     oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator \
#     --namespace flux-system --create-namespace
#
# `make gitops-install` aplica este archivo reemplazando url/ref
# (GITOPS_URL / GITOPS_REF), p. ej. para probar una rama:
#   make gitops-install GITOPS_REF=refs/heads/feature/delivery-integration
#
# Repositorio privado: crea un Secret con username/password (token) en
# flux-system y descomenta pullSecret.
# -------------------------------------------------------------------
apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
spec:
  distribution:
    version: "2.x"
    registry: "ghcr.io/fluxcd"
  components:
    - source-controller
    - kustomize-controller
    - notification-controller
  cluster:
    type: kubernetes
  sync:
    kind: GitRepository
    url: "https://github.com/slashsre/opa-delivery-k8s.git"
    ref: "refs/heads/main"
    path: "./deploy/flux/clusters/kind"
    interval: 1m
    # pullSecret: "git-credentials"
