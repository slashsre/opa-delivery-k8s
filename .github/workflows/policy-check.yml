# -------------------------------------------------------------------
# Gate del repo delivery: valida cada PR (los que abren los pipelines
# consumidores en modo GitOps o los que se editan a mano).
# En Jenkins/GitLab el equivalente es: make test policy-render policy-bundle
# -------------------------------------------------------------------
name: policy-check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CLI tests + policy gate (schema + fmt + opa test)
        run: make test
      - name: Render manifests + bundle
        run: make policy-render policy-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: opa-delivery-${{ github.sha }}
          path: dist/
